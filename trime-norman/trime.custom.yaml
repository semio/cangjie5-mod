patch:
  preset_keyboards:
    cangjie5:
      name: Cangjie5-Norman
      author: "Semio"
      ascii_mode: 0
      width: 10
      # height: 55
      keys:
        - {
            click: q,
            long_click: 1,
            key_back_color: bh1,
            key_text_color: th1,
            label: "難",
          }
        - {
            click: w,
            long_click: 2,
            key_back_color: bh1,
            key_text_color: th1,
            label: "土",
          }
        - {
            click: d,
            long_click: 3,
            key_back_color: bh1,
            key_text_color: th1,
            label: "金",
          }
        - {
            click: f,
            long_click: 4,
            key_back_color: bh1,
            key_text_color: th1,
            label: "木",
          }
        - {
            click: k,
            long_click: 5,
            key_back_color: bh1,
            key_text_color: th1,
            label: "廿",
          }
        - {
            click: j,
            long_click: 6,
            key_back_color: bh1,
            key_text_color: th1,
            label: "田",
          }
        - {
            click: u,
            long_click: 7,
            key_back_color: bh1,
            key_text_color: th1,
            label: "弓",
          }
        - {
            click: r,
            long_click: 8,
            key_back_color: bh1,
            key_text_color: th1,
            label: "中",
          }
        - {
            click: l,
            long_click: 9,
            key_back_color: bh1,
            key_text_color: th1,
            label: "山",
          }
        - {
            click: h,
            long_click: 0,
            key_back_color: bh1,
            key_text_color: th1,
            label: "竹",
          }

        - { width: 5, key_back_color: bh2, key_text_color: th2 }
        - {
            click: a,
            long_click: select_all,
            key_back_color: bh2,
            key_text_color: th2,
            label: "大",
          }
        - {
            click: s,
            long_click: "@",
            key_back_color: bh2,
            key_text_color: th2,
            label: "月",
          }
        - {
            click: e,
            long_click: "#",
            key_back_color: bh2,
            key_text_color: th2,
            label: "日",
          }
        - {
            click: t,
            long_click: "$",
            key_back_color: bh2,
            key_text_color: th2,
            label: "一",
          }
        - {
            click: g,
            long_click: "%",
            swipe_down: "date_time",
            key_back_color: bh2,
            key_text_color: th2,
            label: "尸",
          }
        - {
            click: y,
            long_click: "!",
            swipe_down: "+",
            key_back_color: bh2,
            key_text_color: th2,
            label: "卜",
          }
        - {
            click: n,
            long_click: "&",
            swipe_down: "-",
            key_back_color: bh2,
            key_text_color: th2,
            label: "戈",
          }
        - {
            click: i,
            long_click: "*",
            swipe_down: "_",
            key_back_color: bh2,
            key_text_color: th2,
            label: "人",
          }
        - {
            click: o,
            long_click: "(){Left}",
            swipe_down: "=",
            key_back_color: bh2,
            key_text_color: th2,
            label: "口",
          }
        - { width: 5, key_back_color: bh2, key_text_color: th2 }

        - {
            click: Shift_L,
            label_symbol: " ",
            long_click: Shift_L,
            double_click: Shift_L3,
            composing: delimiter,
            width: 15,
            hilited_key_back_color: benter,
            key_back_color: bbs,
            key_text_color: tbs,
          }
        - {
            click: z,
            long_click: "`",
            swipe_down: "[]{Left}",
            key_back_color: bh3,
            key_text_color: th3,
            label: "z",
          }
        - {
            click: x,
            long_click: cut,
            swipe_down: "{}{Left}",
            key_back_color: bh3,
            key_text_color: th3,
            label: "火",
          }
        - {
            click: c,
            long_click: copy,
            swipe_down: " ",
            key_back_color: bh3,
            key_text_color: th3,
            label: "水",
          }
        - {
            click: v,
            long_click: paste_clip,
            swipe_down: paste,
            key_back_color: bh3,
            key_text_color: th3,
            label: "女",
          }
        - {
            click: b,
            long_click: ";",
            swipe_down: "\\",
            key_back_color: bh3,
            key_text_color: th3,
            label: "十",
          }
        - {
            click: p,
            long_click: ":",
            key_back_color: bh3,
            key_text_color: th3,
            label: "心",
          }
        - {
            click: m,
            long_click: "?",
            swipe_down: "|",
            key_back_color: bh3,
            key_text_color: th3,
            label: "手",
          }
        - {
            click: BackSpace2,
            width: 15,
            key_back_color: bbs,
            key_text_color: tbs,
          }

        - {
            click: Keyboard_number,
            long_click: Menu,
            width: 12.5,
            key_back_color: bgn,
            key_text_color: tgn,
          }
        - {
            click: Keyboard_bqrw,
            label_symbol: "简洁",
            long_click: "{hide_key_symbol}{hide_key_hint}",
            swipe_down: Color_switch,
            swipe_up: Color_switch,
            width: 12.5,
            key_text_size: "18",
            key_back_color: bgn,
            key_text_color: tgn,
          }
        - {
            click: ",",
            label: "，",
            long_click: "<>{Left}",
            key_back_color: bh4,
            key_text_color: th4,
          }
        - {
            click: space,
            long_click: Mode_switch,
            swipe_left: "Left",
            swipe_right: "Right",
            swipe_up: Schema_switchcn,
            width: 30,
            key_back_color: bkg,
            key_text_color: tkg,
          }
        - {
            click: ".",
            label: "。",
            long_click: clipboard_window,
            key_back_color: bh4,
            key_text_color: th4,
          }
        - {
            click: "/",
            long_click: liquid_keyboard_switch,
            key_text_size: "18",
            key_back_color: bh4,
            key_text_color: th4,
          }
        - {
            click: Return,
            label_symbol: "wiki",
            popup: ["TrimeWiki", "Settings"],
            composing: Return1,
            swipe_up: Escape,
            width: 15,
            key_back_color: benter,
            key_text_color: tenter,
          }
